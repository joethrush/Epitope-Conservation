[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epitope-conservation"
version = "0.1.0"
description = "Rank conserved, accessible epitope candidates across protein structures"
requires-python = ">=3.9"
dependencies = [
  "biopython>=1.84",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.scripts]
epitope-conservation = "epitope_conservation.cli:main"

[tool.setuptools.packages.find]
include = ["epitope_conservation*"]
